name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  calidad-y-seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Auditoria de dependencias
        run: npm audit --audit-level=critical

      - name: Construir la imagen
        run: docker build -t api-tareas:${{ github.sha }} .

      - name: Escaneo de la imagen
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-tareas:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
